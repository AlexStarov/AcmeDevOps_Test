replicaCount: 1

image:
  repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/billing-service/app
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  hostname: cell-01.platform.example.com

# External secret containing DB_PASS, AUTH_JWT_SECRET, STRIPE_SECRET_KEY
existingSecret: "billing-service-secrets"

env:
  nodeEnv: development
  pgSslMode: no-verify
  devExposeTokens: "true"
  adminSeedPassword: "change-me"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

networkPolicy:
  enabled: false
